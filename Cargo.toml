[package]
name = "wincron"
version = "0.1.0"
edition = "2021"

[lib]
name = "wincron"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cron = "0.16"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
dirs = "6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
